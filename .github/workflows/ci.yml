name: CI
# Yalnız doküman / not değişen commit'te CI koşmaz (özel repo Actions dakikası, 2026-10-26).
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run gridgrade cek
      - run: uv run pytest -q
      - run: uv run gridgrade isle
      - run: uv run gridgrade uret
      - run: uv run gridgrade kontrol
