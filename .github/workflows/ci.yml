name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run gridgrade cek
      - run: uv run pytest -q
      - run: uv run gridgrade isle
      - run: uv run gridgrade uret
      - run: uv run gridgrade kontrol
