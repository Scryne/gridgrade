name: Publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"   # her gün; EIA aylık dosyaları genelde ayın son haftası güncellenir
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GRIDGRADE_URL: ${{ vars.SITE_URL || 'https://scryne.github.io/gridgrade-site' }}
      GRIDGRADE_ADSENSE: ${{ vars.ADSENSE_CLIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run gridgrade hepsi
      - name: Kaynak tarihlerini kaydet (değiştiyse)
        run: |
          if ! git diff --quiet -- veri/kaynaklar.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add veri/kaynaklar.json
            git commit -m "Veri: EIA kaynakları güncellendi [skip ci]"
            git push
          fi
      - name: Herkese açık site reposunu al
        uses: actions/checkout@v4
        with:
          repository: Scryne/gridgrade-site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      - name: Üretilen siteyi gönder
        run: |
          rsync -a --delete --exclude .git dist/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "Site: $(date -u +%Y-%m-%d) derlemesi"
          git push
          echo "degisti=1" >> "$GITHUB_ENV"
      - name: Arama motorlarına bildir (IndexNow)
        if: env.degisti == '1'
        continue-on-error: true   # bildirim başarısızlığı yayını bozmasın
        run: |
          sleep 60   # Pages yeni içeriği yayınlasın
          uv run gridgrade bildir
